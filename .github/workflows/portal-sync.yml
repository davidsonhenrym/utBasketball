name: Sync Transfer Portal

on:
  schedule:
    # Runs every day at 7 AM and 3 PM Eastern (12:00 and 20:00 UTC)
    - cron: '0 12 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright beautifulsoup4 openpyxl

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run portal scraper
        run: python portal_scraper.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portal_snapshot_latest.json
          git add portal_snapshot_*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: portal snapshot $(date -u +%Y-%m-%d)"
          git push
